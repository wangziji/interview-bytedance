name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, cursor/lbs-interview-site-4d8d]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python solutions
        run: |
          python3 code/python/solutions.py
          python3 code/python/more.py
      - name: Java solutions
        run: |
          javac -d /tmp/algo-java code/java/AlgoLab.java code/java/MoreLab.java
          java -cp /tmp/algo-java AlgoLab
          java -cp /tmp/algo-java MoreLab
      - name: Go solutions
        working-directory: code/go
        run: go test ./...
      - name: Site data matches the generators
        run: |
          python3 tools/build_site.py
          git diff --exit-code -- public/js/data.js
      - name: Site scripts parse
        run: |
          node --check public/js/app.js
          node --check public/js/labs.js
          node --check public/js/data.js

  pages-enabled:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      ok: ${{ steps.enabled.outputs.ok }}
    steps:
      - id: enabled
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled. Set Settings → Pages → Source to GitHub Actions, then rerun this workflow."
          fi

  deploy:
    needs: [test, pages-enabled]
    if: needs.pages-enabled.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
